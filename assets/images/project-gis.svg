<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b26" />
      <stop offset="100%" stop-color="#0d141e" />
    </linearGradient>
    <radialGradient id="heat1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="heat2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Map Grid and Roads -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>

  <!-- Stylized Road Network -->
  <g stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M 280,720 Q 380,480 520,380 T 820,240 T 1280,180" fill="none" />
    <path d="M 0,420 Q 320,400 620,460 T 1100,520 T 1280,560" fill="none" />
    <path d="M 720,0 Q 680,240 760,420 T 640,720" fill="none" />
    <path d="M 420,0 Q 460,280 340,540 T 400,720" fill="none" />
  </g>
  <g stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M 280,720 Q 380,480 520,380 T 820,240 T 1280,180" fill="none" stroke-dasharray="10 8" />
    <path d="M 0,420 Q 320,400 620,460 T 1100,520 T 1280,560" fill="none" stroke-dasharray="10 8" />
    <path d="M 720,0 Q 680,240 760,420 T 640,720" fill="none" />
  </g>

  <!-- Heatmaps -->
  <circle cx="760" cy="380" r="220" fill="url(#heat1)" />
  <circle cx="520" cy="420" r="180" fill="url(#heat2)" />
  <circle cx="920" cy="260" r="160" fill="url(#heat1)" opacity="0.6" />

  <!-- Radius rings from Candidate Site -->
  <circle cx="760" cy="380" r="90" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7" />
  <circle cx="760" cy="380" r="170" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
  <text x="855" y="375" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.8">1.0 km radius</text>
  <text x="935" y="375" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.6">2.0 km radius</text>

  <!-- Competitor Pins -->
  <!-- Comp 1 -->
  <g transform="translate(610, 310)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" opacity="0.2" />
    <circle cx="0" cy="0" r="8" fill="#ef4444" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <rect x="-45" y="-32" width="90" height="20" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <text x="0" y="-18" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cafe Rival A</text>
  </g>

  <!-- Comp 2 -->
  <g transform="translate(930, 260)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" opacity="0.2" />
    <circle cx="0" cy="0" r="8" fill="#ef4444" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <rect x="-45" y="-32" width="90" height="20" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
    <text x="0" y="-18" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Coffee Shop B</text>
  </g>

  <!-- Prime Candidate Location Pin -->
  <g transform="translate(760, 380)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#10b981" opacity="0.25">
      <animate attributeName="r" values="24;36;24" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="14" fill="#10b981" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <path d="M 0,14 L 0,0" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1280" height="64" fill="#090d14" opacity="0.94" />
  <line x1="0" y1="64" x2="1280" y2="64" stroke="#1e293b" stroke-width="1" />
  
  <text x="32" y="38" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">GIS Coffee Branch Analytics</text>
  <text x="280" y="38" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">| Spatial Multi-Criteria Decision Evaluation · UNIKOM</text>

  <rect x="1080" y="18" width="168" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="1098" cy="32" r="5" fill="#10b981" />
  <text x="1114" y="36" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Spatial Mode: Live</text>

  <!-- Floating Left Filter Card -->
  <g transform="translate(32, 90)">
    <rect width="250" height="340" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="34" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Spatial Criteria Layer</text>
    
    <!-- Criterion 1 -->
    <text x="20" y="74" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Competitor Buffer</text>
    <rect x="20" y="86" width="210" height="6" rx="3" fill="#334155" />
    <rect x="20" y="86" width="150" height="6" rx="3" fill="#10b981" />
    <text x="180" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">1.8 km</text>

    <!-- Criterion 2 -->
    <text x="20" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Daily Traffic Volume</text>
    <rect x="20" y="142" width="210" height="6" rx="3" fill="#334155" />
    <rect x="20" y="142" width="180" height="6" rx="3" fill="#06b6d4" />
    <text x="170" y="130" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="11">14.2k/day</text>

    <!-- Criterion 3 -->
    <text x="20" y="186" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Youth Demographic</text>
    <rect x="20" y="198" width="210" height="6" rx="3" fill="#334155" />
    <rect x="20" y="198" width="160" height="6" rx="3" fill="#f59e0b" />
    <text x="190" y="186" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11">68%</text>

    <!-- Divider -->
    <line x1="20" y1="230" x2="230" y2="230" stroke="#1e293b" />

    <!-- Summary recommendation -->
    <rect x="20" y="250" width="210" height="64" rx="6" fill="#064e3b" opacity="0.4" stroke="#059669" stroke-width="1" />
    <text x="32" y="274" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Status: Prime Expansion Zone</text>
    <text x="32" y="295" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10">High margin, low cluster conflict</text>
  </g>

  <!-- Floating Right Decision Card -->
  <g transform="translate(940, 90)">
    <rect width="308" height="230" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <text x="22" y="34" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Candidate Site #01 (Dago/KBB)</text>
    <text x="22" y="52" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Lat: -6.8824 · Lng: 107.6142</text>
    
    <rect x="22" y="74" width="264" height="68" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="38" y="102" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Viability Score Index</text>
    <text x="38" y="130" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800">88.4 <tspan font-size="14" fill="#64748b">/ 100</tspan></text>

    <text x="22" y="172" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Haversine Distance to Rivals:</text>
    <text x="22" y="194" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">1.82 KM (Safe buffer zone)</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(32, 630)">
    <rect width="1216" height="66" rx="8" fill="#090d14" opacity="0.95" stroke="#1e293b" stroke-width="1" />
    
    <g transform="translate(30, 22)">
      <text x="0" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">CANDIDATE LOCATIONS</text>
      <text x="0" y="32" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">14 Surveyed Sites</text>
    </g>

    <line x1="240" y1="12" x2="240" y2="54" stroke="#1e293b" />

    <g transform="translate(270, 22)">
      <text x="0" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">COMPETITOR RADIUS</text>
      <text x="0" y="32" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">&gt; 1.5 KM Optimized</text>
    </g>

    <line x1="500" y1="12" x2="500" y2="54" stroke="#1e293b" />

    <g transform="translate(530, 22)">
      <text x="0" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">DATA ENGINE</text>
      <text x="0" y="32" fill="#06b6d4" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Leaflet.js + Haversine Math</text>
    </g>

    <line x1="800" y1="12" x2="800" y2="54" stroke="#1e293b" />

    <g transform="translate(830, 22)">
      <text x="0" y="14" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">OUTCOME</text>
      <text x="0" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Strategic Branch Feasibility Confirmed</text>
    </g>
  </g>
</svg>
